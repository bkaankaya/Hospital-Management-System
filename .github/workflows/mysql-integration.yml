name: Hospital isolated MySQL integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only-password
          MYSQL_DATABASE: hospital
        ports:
          - 3306:3306
    env:
      HOSPITAL_DB_URL: jdbc:mysql://127.0.0.1:3306/hospital?useSSL=false&allowPublicKeyRetrieval=true
      HOSPITAL_DB_USER: root
      HOSPITAL_DB_PASSWORD: ci-local-only-password
      JAVA_TOOL_OPTIONS: -Dhospital.ci.legacyFixtures=true
      HOSPITAL_DATA_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap disposable MySQL database
        run: |
          container="$(docker ps --filter ancestor=mysql:8.0 --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$container" mysqladmin ping -h 127.0.0.1 -uroot -pci-local-only-password --silent; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker exec -i "$container" mysql -uroot -pci-local-only-password < db/schema.sql
      - name: Package application using existing pinned versions
        run: mvn -B -q -DskipTests package
      - name: Compile and run database integration smoke
        run: |
          mkdir -p build/integration-tests
          javac --release 11 -encoding UTF-8 -cp target/hospital-management-system-2.0.0.jar -d build/integration-tests test/db/IntegrationSmokeTest.java
          java -Djava.awt.headless=true -cp target/hospital-management-system-2.0.0.jar:build/integration-tests db.IntegrationSmokeTest
      - name: Verify real HTTPS gateway with a separate, audit-restricted MySQL identity
        run: |
          set -euo pipefail
          container="$(docker ps --filter ancestor=mysql:8.0 --format '{{.ID}}' | head -n 1)"
          docker exec -i "$container" mysql -uroot -pci-local-only-password < db/ci/least_privilege.sql
          mkdir -p build/gateway-ci
          keytool -genkeypair -alias hospital-test -keyalg RSA -keysize 2048 -storetype PKCS12 \
            -keystore build/gateway-ci/server.p12 -storepass ci-keystore-only-password \
            -keypass ci-keystore-only-password -dname "CN=localhost" \
            -ext "SAN=dns:localhost,ip:127.0.0.1" -validity 1 -noprompt
          keytool -exportcert -alias hospital-test -keystore build/gateway-ci/server.p12 \
            -storepass ci-keystore-only-password -rfc -file build/gateway-ci/server.crt
          keytool -importcert -noprompt -trustcacerts -alias hospital-test \
            -file build/gateway-ci/server.crt -keystore build/gateway-ci/trust.p12 \
            -storetype PKCS12 -storepass ci-trust-only-password
          javac --release 11 -encoding UTF-8 -cp target/hospital-management-system-2.0.0.jar \
            -d build/integration-tests test/db/GatewayIntegrationTest.java
          mkdir -p build/gateway-ci/keys
          chmod 700 build/gateway-ci/keys
          printf '%s' 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' > build/gateway-ci/keys/ci1.key
          chmod 600 build/gateway-ci/keys/ci1.key
          export HOSPITAL_DATA_KEYRING_DIR="$PWD/build/gateway-ci/keys"
          export HOSPITAL_DATA_ACTIVE_KEY_ID=ci1
          export HOSPITAL_SERVER_KEYSTORE="$PWD/build/gateway-ci/server.p12"
          export HOSPITAL_SERVER_KEYSTORE_PASSWORD=ci-keystore-only-password
          export HOSPITAL_ADMIN_PASSWORD=ci-admin-gateway-demo-password
          export HOSPITAL_GATEWAY_URL=https://localhost:8443/api
          export HOSPITAL_TEST_DB_USER=hospital_ci
          export HOSPITAL_TEST_DB_PASSWORD=ci-isolated-hospital-user-password
          HOSPITAL_DB_USER=hospital_ci HOSPITAL_DB_PASSWORD=ci-isolated-hospital-user-password \
            java -Dhospital.ci.legacyFixtures=false -cp target/hospital-management-system-2.0.0.jar db.GatewayServer &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/8443' 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" -eq 1
          java -Dhospital.ci.legacyFixtures=false \
            -Djavax.net.ssl.trustStore="$PWD/build/gateway-ci/trust.p12" \
            -Djavax.net.ssl.trustStoreType=PKCS12 \
            -Djavax.net.ssl.trustStorePassword=ci-trust-only-password \
            -cp target/hospital-management-system-2.0.0.jar:build/integration-tests db.GatewayIntegrationTest
      - name: Verify backup restore, guarded backfill and versioned key rotation
        run: |
          set -euo pipefail
          mkdir -p build/migration
          container="$(docker ps --filter ancestor=mysql:8.0 --format '{{.ID}}' | head -n 1)"
          docker exec "$container" mysqldump -uroot -pci-local-only-password \
            --single-transaction --triggers --routines --events hospital > build/migration/before.sql
          test -s build/migration/before.sql
          docker exec "$container" mysql -uroot -pci-local-only-password -e \
            'CREATE DATABASE hospital_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec -i "$container" mysql -uroot -pci-local-only-password \
            hospital_restore < build/migration/before.sql
          javac --release 11 -encoding UTF-8 -cp target/hospital-management-system-2.0.0.jar \
            -d build/integration-tests test/db/RestoreVerificationTest.java test/db/MigrationVerificationTest.java
          export HOSPITAL_TEST_RESTORE_DB_URL='jdbc:mysql://127.0.0.1:3306/hospital_restore?useSSL=false&allowPublicKeyRetrieval=true'
          java -cp target/hospital-management-system-2.0.0.jar:build/integration-tests db.RestoreVerificationTest
          export HOSPITAL_DATA_KEYRING_DIR="$PWD/build/gateway-ci/keys"
          export HOSPITAL_DATA_ACTIVE_KEY_ID=ci1
          export HOSPITAL_MIGRATION_BACKUP_FILE="$PWD/build/migration/before.sql"
          export HOSPITAL_MIGRATION_BACKUP_SHA256="$(sha256sum "$HOSPITAL_MIGRATION_BACKUP_FILE" | cut -d' ' -f1)"
          export HOSPITAL_MIGRATION_APPROVAL=YES_BACKUP_RESTORED
          java -cp target/hospital-management-system-2.0.0.jar db.LegacyDataMigrator --scan
          java -cp target/hospital-management-system-2.0.0.jar db.LegacyDataMigrator --apply
          java -cp target/hospital-management-system-2.0.0.jar:build/integration-tests \
            db.MigrationVerificationTest ci1
          java -cp target/hospital-management-system-2.0.0.jar \
            db.LegacyDataMigrator --apply | tee build/migration/idempotency.log
          grep -q 'Updated clinical rows: 0' build/migration/idempotency.log
          grep -q 'Updated address rows: 0' build/migration/idempotency.log
          docker exec "$container" mysqldump -uroot -pci-local-only-password \
            --single-transaction --triggers --routines --events hospital > build/migration/pre-rotation.sql
          export HOSPITAL_MIGRATION_BACKUP_FILE="$PWD/build/migration/pre-rotation.sql"
          export HOSPITAL_MIGRATION_BACKUP_SHA256="$(sha256sum "$HOSPITAL_MIGRATION_BACKUP_FILE" | cut -d' ' -f1)"
          printf '%s' 'ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=' \
            > "$HOSPITAL_DATA_KEYRING_DIR/ci2.key"
          chmod 600 "$HOSPITAL_DATA_KEYRING_DIR/ci2.key"
          export HOSPITAL_DATA_ACTIVE_KEY_ID=ci2
          java -cp target/hospital-management-system-2.0.0.jar db.LegacyDataMigrator --apply
          java -cp target/hospital-management-system-2.0.0.jar:build/integration-tests \
            db.MigrationVerificationTest ci2
          rm -f build/migration/*.sql
      - name: Compile and render the real Swing application under Xvfb
        run: |
          command -v xvfb-run
          javac --release 11 -encoding UTF-8 -cp target/hospital-management-system-2.0.0.jar -d build/integration-tests test/db/GuiSmokeTest.java
          xvfb-run -a java -Djava.awt.headless=false -cp target/hospital-management-system-2.0.0.jar:build/integration-tests db.GuiSmokeTest
          javac --release 11 -encoding UTF-8 -cp target/hospital-management-system-2.0.0.jar -d build/integration-tests test/db/GuiWorkflowTest.java
          xvfb-run -a java -Djava.awt.headless=false -cp target/hospital-management-system-2.0.0.jar:build/integration-tests db.GuiWorkflowTest
      - name: Preserve Java Swing GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospital-swing-gui-preview
          path: build/screenshots/*.png
          retention-days: 3
          if-no-files-found: warn
